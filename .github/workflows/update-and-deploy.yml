name: Update GLI data and deploy

on:
  schedule:
    # 23:30 UTC daily = 07:30 Asia/Shanghai the following morning.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh GLI data
        run: |
          if ! python scripts/update_data.py; then
            echo "Yahoo refresh failed; keeping the existing GLI snapshot and patching TQQQ from Nasdaq."
            python scripts/patch_tqqq.py
          fi

      - name: Refresh Treasury yields
        run: python scripts/update_yields.py

      - name: Refresh PE ratios
        run: python scripts/update_pe.py

      - name: Refresh cash / equity ratio
        run: python scripts/update_cash_equity.py

      - name: Persist raw and generated data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update GLI data $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gli-data-${{ github.run_id }}
          path: |
            site/data/gli.json
            site/data/gli_daily.csv
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deployment summary
        run: |
          DATA_DATE=$(python -c "import json; print(json.load(open('site/data/gli.json'))['meta']['as_of'])")
          echo "### GLI COMPASS deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data as of: ${DATA_DATE}" >> "$GITHUB_STEP_SUMMARY"
